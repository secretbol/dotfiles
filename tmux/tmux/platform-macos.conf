# vim: set ft=tmux:
# macOS-specific tmux configuration

# status line 3: the MacOS label beside the date and the clocks (the line itself
# is in status-bar.conf), and on the right the VPN connection status (launchd
# OpenVPN services, the Baly tunnel and the Nobitex tunnels).
#
# The Nobitex tunnels are dialed by vpn/nobitex/connect.sh in the keys repo, as
# sudo openvpn on a temp config, so there is no launchd service to probe. Each
# one pushes one /16 that nothing else routes: afranet 172.26 (also tools and
# staging) shown as 🌳, shatel 172.25 as 🚀, office 172.23 as 🏢. The dev cluster
# is a WireGuard peer (nobitex-dev.conf in the keys repo, 172.31/16), shown as 👷:
# wg-quick installs the same kind of route on a utun. The awk must not contain a
# percent sign: tmux runs strftime over the whole format, so a printf "%s" turned
# into the epoch seconds, a row of digits. Match on that route over a utun, the
# way Baly is matched below. netstat prints a /16 as "172.26".
#
# Baly is an on-demand OpenVPN (vpn-baly from the keys repo) with Google SSO, so
# it is not a launchd service to probe either. Match on the route it pushes for
# 10.40/16 (GitLab and its registry): nothing else here routes that range, and
# netstat needs no root. It replaced the Snapp DC tunnel, dead since 2026-10-12.
set -g @status-label '  MacOS'
set -ag status-format[3] \
"#[align=right, fg=#9dffce] \
#(netstat -rnf inet 2>/dev/null | awk '$1 == \"10.40/16\" && \$NF ~ /^utun/ {print \"baly \"; exit}') \
#[fg=#1e90ff] \
#(launchctl print system/com.openvpn.aut 2>/dev/null | grep -q 'state = running' && echo "aut") \
#[fg=#ffd27f] \
#(launchctl print system/com.openvpn.home 2>/dev/null | grep -q 'state = running' && echo "home") \
#(launchctl print system/com.openvpn.iran 2>/dev/null | grep -q 'state = running' && echo "iran") \
#[fg=#ffa86b] \
#(netstat -rnf inet 2>/dev/null | awk '\$NF ~ /^utun/ {if (\$1 ~ /^172\\.26(\\/16)?\$/) a=\"🌳 172.26/16 \"; else if (\$1 ~ /^172\\.25(\\/16)?\$/) s=\"🚀 172.25/16 \"; else if (\$1 ~ /^172\\.23(\\/16)?\$/) o=\"🏢 172.23/16 \"; else if (\$1 ~ /^172\\.31(\\/16)?\$/) d=\"👷 172.31/16 \"} END {print a s o d}') \
#[fg=#96ded1] \
#(launchctl print system/com.openvpn.swif-ai 2>/dev/null | grep -q 'state = running' && echo "swif-ai")"
